# Sub2API application: stateless Deployment + ClusterIP Service, scaled by its
# own HorizontalPodAutoscaler. All shared state lives in PostgreSQL and Redis.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sub2api
  labels:
    app.kubernetes.io/name: sub2api
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: sub2api
  labels:
    app.kubernetes.io/name: sub2api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sub2api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub2api
  labels:
    app.kubernetes.io/name: sub2api
spec:
  # replicas is intentionally omitted: the HPA below owns it.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sub2api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sub2api
    spec:
      serviceAccountName: sub2api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # sub2api user in the image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sub2api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sub2api
      containers:
        - name: sub2api
          image: weishaw/sub2api # tag is set by scripts/deploy.sh (SUB2API_IMAGE / SUB2API_TAG)
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: sub2api-env
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef: { name: sub2api-site, key: TZ }
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: username }
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: password }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-credentials, key: password }
            # Only used to create the first admin when the database is empty.
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: sub2api-secrets, key: admin-email }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: sub2api-secrets, key: admin-password }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: sub2api-secrets, key: jwt-secret }
            - name: TOTP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: sub2api-secrets, key: totp-encryption-key }
          ports:
            - name: http
              containerPort: 8080
          # Generous startup window: the first pod runs all database migrations.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 72
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          lifecycle:
            # Keep serving while the endpoint is removed from nginx's upstream.
            preStop:
              exec:
                command: [sleep, "15"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Scratch space: generated config.yaml, install lock, pricing cache.
            # Nothing here needs to survive a restart.
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sub2api
  labels:
    app.kubernetes.io/name: sub2api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sub2api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      # Scale in slowly: pods carry long-lived streaming responses.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sub2api
  labels:
    app.kubernetes.io/name: sub2api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sub2api
