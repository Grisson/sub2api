# Redis configuration for Sub2API. The password is NOT stored here: the
# container start command appends "requirepass" from the redis-credentials Secret.
bind 0.0.0.0
port 6379
protected-mode yes
tcp-keepalive 60
maxclients 10000

# Persistence on the Azure disk mounted at /data
dir /data
appendonly yes
appendfsync everysec
save 60 1

# Never evict: Redis holds concurrency slots and scheduling state, not only cache.
maxmemory-policy noeviction
